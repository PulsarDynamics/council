[package]
name = "council-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Council agent process: LLM client, tools, Redis pub/sub subscriber."

[[bin]]
name = "council-agent"
path = "src/main.rs"

[dependencies]
council-core = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
redis = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
notify = { workspace = true }
scraper = { workspace = true }
url = { workspace = true }
rusqlite = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(test)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }

# Many items (provider trait methods, registry helpers, search_code) are
# public API surface that future cycles will use. Strict dead_code
# enforcement in the scaffold would be noise.
dead_code = "allow"
