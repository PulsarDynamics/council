[workspace]
resolver = "2"
members = [
    "crates/council-core",
    "crates/council-orchestrator",
    "crates/council-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
# Internal
council-core = { path = "crates/council-core" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Errors
thiserror = "1"
anyhow = "1"

# Common
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"

# Async
tokio = { version = "1", features = ["full"] }

# HTTP / WS (orchestrator)
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# Redis pub/sub
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# LLM HTTP (agent)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# File watcher (agent)
notify = "6"

# Web search tool (agent)
scraper = "0.20"
url = "2"

# Memory tool (agent)
rusqlite = { version = "0.32", features = ["bundled"] }

# Async stream utilities (agent — SSE bridge in default LlmProvider::stream)
async-stream = "0.3"
bytes = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
